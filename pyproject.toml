[project]
name = "planning-tool"
version = "2.1.1"
description = "Planning-Tool 2.0 (Excel) + ALM Planning-Tool 0.0.0 (ALM CSV); Outlook scheduling, Markdown and ICS"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openpyxl>=3.1.0",
    "icalendar>=6.0.0",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
outlook = ["pywin32>=306; sys_platform == 'win32'"]
dev = ["pytest>=8.0.0"]

[project.scripts]
plan-work = "planning_tool.cli:main"
planning-tool-gui = "planning_tool.gui:main"
alm-plan = "alm_planning_tool.cli:main"
alm-planning-tool-gui = "alm_planning_tool.gui:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["planning_tool*", "alm_planning_tool*"]
