[project]
name = "planning-tool"
version = "2.0.0"
description = "Excel/CSV work-package import and scheduling with Outlook calendar; Markdown and ICS output"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openpyxl>=3.1.0",
    "icalendar>=6.0.0",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
outlook = ["pywin32>=306; sys_platform == 'win32'"]
dev = ["pytest>=8.0.0"]

[project.scripts]
plan-work = "planning_tool.cli:main"
planning-tool-gui = "planning_tool.gui:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["planning_tool*"]
